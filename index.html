<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon A+ 图片展示</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;background:#f6f7f8}
    .wrap{max-width:1200px;margin:40px auto;padding:0 16px}
    .block{margin-bottom:0}
    .full img{width:100%;display:block;border-radius:0}

    /* 轮播 */
    .carousel{position:relative;overflow:hidden;border-radius:0;background:#fff}
    .track{display:flex;transition:transform .5s ease}
    .slide{min-width:100%}
    .slide img{width:100%;height:auto;display:block;object-fit:contain;background:#fff}
    .btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
    .prev{left:12px}.next{right:12px}
    .dots{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:5
}
    .dot{width:10px;height:10px;border-radius:50%;background:#ccc;cursor:pointer}
    .dot.active{background:#333}
  </style>
</head>
<body>
<div class="wrap">

  <!-- 图一：1464*1200 顶部主图（不轮播） -->
  <div class="block full">
    <img src="amazon-a-plus/images/Banner-1.png" alt="A+ 主图">
  </div>

  <!-- 第二行：1464*600 轮播图 -->
  <div class="block">
    <div class="carousel" data-carousel style="position:relative">
      <div class="track">
        <div class="slide"><img src="amazon-a-plus/images/Banner-2.png"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-2-1.png"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-2-2.png"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-2-3.png"></div>
      </div>
      <button class="btn prev">‹</button>
      <button class="btn next">›</button>
    </div>
    <div class="dots"></div>
  </div>

  <!-- 第三行：1464*600 普通展示 -->
  <div class="block full">
    <img src="amazon-a-plus/images/Banner-3.png" alt="A+ 卖点">
  </div>

  <!-- 第四行：1464*600 轮播图（统一尺寸，防止不连贯） -->
  <div class="block">
    <div class="carousel" data-carousel>
      <div class="track">
        <div class="slide"><img src="amazon-a-plus/images/Banner-4.png" style="aspect-ratio:1464/600;object-fit:cover"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-4-1.png" style="aspect-ratio:1464/600;object-fit:cover"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-4-2.png" style="aspect-ratio:1464/600;object-fit:cover"></div>
        <div class="slide"><img src="amazon-a-plus/images/Banner-4-3.png" style="aspect-ratio:1464/600;object-fit:cover"></div>
      </div>
      <button class="btn prev">‹</button>
      <button class="btn next">›</button>
      <div class="dots"></div>
    </div>
  </div>

  <!-- 第五行：1464*600 普通展示 -->
  <div class="block full">
    <img src="amazon-a-plus/images/Banner-5.png" alt="A+ 卖点">
  </div>

</div>

<script>
  document.querySelectorAll('[data-carousel]').forEach(carousel=>{
    const track=carousel.querySelector('.track');
    const slides=carousel.querySelectorAll('.slide');
    const dotsWrap=carousel.parentElement.querySelector('.dots');
    let i=0;

    slides.forEach((_,idx)=>{
      const d=document.createElement('div');
      d.className='dot'+(idx===0?' active':'');
      d.onclick=()=>go(idx);
      dotsWrap.appendChild(d);
    });
    const dots=dotsWrap.querySelectorAll('.dot');

    function update(){track.style.transform=`translateX(-${i*100}%)`;dots.forEach(d=>d.classList.remove('active'));dots[i].classList.add('active');}
    function go(n){i=n;update()}
    carousel.querySelector('.next').onclick=()=>{i=(i+1)%slides.length;update()}
    carousel.querySelector('.prev').onclick=()=>{i=(i-1+slides.length)%slides.length;update()}
  })
</script>
</body>
</html>
