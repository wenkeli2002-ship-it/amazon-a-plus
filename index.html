<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon A+ 图片展示</title>
  <style>
    body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:#fff;   /* 全页面白色 */
}

    .wrap{max-width:1200px;margin:40px auto;padding:0 16px}
    .block{margin-bottom:0}
    .full img{width:100%;display:block;border-radius:0}

/* ===== Amazon 主图 + 副图（紧凑版） ===== */
.product-gallery{
  max-width:1200px;      /* 主图整体变窄 */
  margin:0 auto 16px;    /* 下方留白变小 */
  background:#fff;
  padding:16px 0;        /* 上下内边距减小 */
}

.main-image img{
  width:100%;
  max-width:1200px;      /* 控制主图高度 */
  display:block;
  margin:0 auto;
}

.thumbs{
  display:flex;
  gap:10px;              /* 缩略图间距缩小 */
  margin-top:8px;        /* 缩略图更靠近主图 */
  padding:0 12px;
  justify-content:center;/* 居中，更像 Amazon */
}

.thumbs img{
  width:60px;            /* 缩略图尺寸缩小 */
  height:60px;
  object-fit:cover;
  cursor:pointer;
  border:2px solid transparent;
}

.thumbs img.active{
  border-color:#111;
}


    /* ===== A+ 轮播 ===== */
    .carousel{position:relative;overflow:hidden;border-radius:0;background:#fff}
    .track{display:flex;transition:transform .5s ease}
    .slide{min-width:100%}
    .slide img{width:100%;height:auto;display:block;object-fit:contain;background:#fff}
    .btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
    .prev{left:12px}.next{right:12px}
    .dots{
      position:absolute;
      left:50%;
      bottom:10%;
      transform:translateX(-50%);
      display:flex;
      gap:8px;
      z-index:5
    }
    .dot{width:10px;height:10px;border-radius:50%;background:#ccc;cursor:pointer}
    .dot.active{background:#333}
  </style>
</head>
<body>

<div class="wrap">

  /* 保证主副图永远不出现轮播点点 */
.product-gallery .dots{
  display:none !important;
}

  <!-- ===== Amazon 主图 + 副图轮播 ===== -->
  <div class="block">
    <div class="product-gallery">
      <div class="main-image">
        <img id="mainImage" src="images/Main-1600.png" alt="Amazon 主图">
      </div>
      <div class="thumbs">
        <img src="images/Main-1600.png" class="active">
        <img src="images/Sub-1.png">
        <img src="images/Sub-2.png">
        <img src="images/Sub-3.png">
        <img src="images/Sub-4.png">
        <img src="images/Sub-5.png">
      </div>
    </div>
  </div>

  <!-- 图一：1464*1200 -->
  <div class="block full">
    <img src="images/Banner-1.png" alt="A+ 主图">
  </div>

  <!-- 图二：1464*600 轮播 -->
  <div class="block">
    <div class="carousel" data-carousel>
      <div class="track">
        <div class="slide"><img src="images/Banner-2.png"></div>
        <div class="slide"><img src="images/Banner-2-1.png"></div>
        <div class="slide"><img src="images/Banner-2-2.png"></div>
        <div class="slide"><img src="images/Banner-2-3.png"></div>
      </div>
      <button class="btn prev">‹</button>
      <button class="btn next">›</button>
    </div>
    <div class="dots"></div>
  </div>

  <!-- 图三 -->
  <div class="block full">
    <img src="images/Banner-3.png">
  </div>

  <!-- 图四：轮播 -->
  <div class="block">
    <div class="carousel" data-carousel>
      <div class="track">
        <div class="slide"><img src="images/Banner-4.png"></div>
        <div class="slide"><img src="images/Banner-4-1.png"></div>
        <div class="slide"><img src="images/Banner-4-2.png"></div>
        <div class="slide"><img src="images/Banner-4-3.png"></div>
      </div>
      <button class="btn prev">‹</button>
      <button class="btn next">›</button>
      <div class="dots"></div>
    </div>
  </div>

  <!-- 图五 -->
  <div class="block full">
    <img src="images/Banner-5.png">
  </div>

</div>

<script>
  /* 主图缩略切换 */
  const mainImage = document.getElementById('mainImage');
  document.querySelectorAll('.thumbs img').forEach(thumb=>{
    thumb.onclick = ()=>{
      document.querySelectorAll('.thumbs img').forEach(t=>t.classList.remove('active'));
      thumb.classList.add('active');
      mainImage.src = thumb.src;
    }
  });

  /* A+ 轮播 */
  document.querySelectorAll('[data-carousel]').forEach(carousel=>{
    const track=carousel.querySelector('.track');
    const slides=carousel.querySelectorAll('.slide');
    const dotsWrap=carousel.parentElement.querySelector('.dots');
    let i=0;

    slides.forEach((_,idx)=>{
      const d=document.createElement('div');
      d.className='dot'+(idx===0?' active':'');
      d.onclick=()=>go(idx);
      dotsWrap.appendChild(d);
    });
    const dots=dotsWrap.querySelectorAll('.dot');

    function update(){
      track.style.transform=`translateX(-${i*100}%)`;
      dots.forEach(d=>d.classList.remove('active'));
      dots[i].classList.add('active');
    }
    function go(n){i=n;update()}
    carousel.querySelector('.next').onclick=()=>{i=(i+1)%slides.length;update()}
    carousel.querySelector('.prev').onclick=()=>{i=(i-1+slides.length)%slides.length;update()}
  })
</script>

</body>
</html>
